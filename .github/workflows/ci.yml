name: CI

# The `changes` job classifies what a run changed (.github/actions/changes). A pull request that
# touches only documentation (Markdown, docs/, changelog, licence) skips the test jobs; `changes`
# itself always runs and is the green check such a pull request reports.

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, Monday: the whole suite on master, and the check that the branch rules on GitHub
  # are the ones in .github/rulesets/master.json.
  schedule:
    - cron: '57 4 * * 1'
  workflow_dispatch:

# Every job only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

# A newer push to the same pull request cancels its run in progress. Every other run (push to main,
# tag, manual) gets a group of its own: GitHub keeps only one pending run per group, so a shared
# group would cancel a pending main run whose changes the next run never classifies again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every external action is referenced by a full commit SHA, with its version as a comment: a tag
  # can be moved to other code, a commit cannot. Dependabot keeps the SHAs current.
  pinned:
    name: Actions pinned to commit SHAs
    needs: changes
    # Fail-safe as for the other jobs: a failed `changes` job leaves docs_only empty, and the check
    # runs. A documentation-only change cannot touch a workflow or an action.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Every external action is pinned to a full commit SHA
        run: |
          # The key is spelled apart, so this file does not match its own pattern.
          key=uses
          unpinned=$(grep -rnoE "${key}:\s*[^ #]+" .github/ | grep -v "${key}: \./" | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Actions not pinned to a full commit SHA (owner/action@<sha> # vX.Y.Z):"
            echo "$unpinned"
            exit 1
          fi

  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # pull_request: the merge commit and both parents; push: the pushed range
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - id: changes
        uses: ./.github/actions/changes

  test:
    name: PHP ${{ matrix.php-version }}
    needs: changes
    # Fail-safe: a failed `changes` job leaves its outputs empty, and the tests run. Without
    # !cancelled() the job would be skipped instead, and skipped counts as passed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.2' && 'xdebug' || 'none' }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        if: matrix.php-version != '8.2'
        run: vendor/bin/phpunit

      - name: Run tests with coverage
        if: matrix.php-version == '8.2'
        run: vendor/bin/phpunit --coverage-text

  lowest:
    name: PHP 8.2, lowest dependencies
    needs: changes
    # Fail-safe as for `test`.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none

      # composer.lock is not committed, so the `test` job always resolves the
      # newest allowed dependency. brick/math spans nine 0.x minors and 1.0
      # here, and its floor (0.12, where RoundingMode's cases are still
      # SCREAMING_SNAKE) is the half the `test` job never touches.
      - name: Install lowest dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # Weekly and on demand: the ruleset GitHub enforces on master is the one in .github/rulesets/master.json.
  # Not part of "CI passed": a pull request that changes the file differs from GitHub until the
  # ruleset is applied after the merge.
  ruleset:
    name: Branch rules match .github/rulesets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compare the ruleset on GitHub with the file
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/rulesets/check.sh "${{ github.repository }}" .github/rulesets/master.json

  # The one check a merge into master requires. Its name is in .github/rulesets/master.json: renaming the
  # job blocks every merge until the ruleset on GitHub is changed too. A job's own name changes with
  # its matrix and shows unexpanded when the job is skipped, so the branch rules name this job
  # instead. Skipped on purpose (a documentation-only pull request) counts as passed; failed or
  # cancelled does not. always(), not !cancelled(): a skipped job counts as passed, so this job has
  # to run and report in every case.
  passed:
    name: CI passed
    needs: [changes, test, lowest, pinned]
    if: always()
    runs-on: ubuntu-latest
    # Reads this run's job list, nothing else.
    permissions:
      actions: read
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
          # Jobs this check leaves out, by the start of their name: the weekly ruleset check, not in needs
          UNGATED: '["Branch rules match"]'
        # needs.<job>.result can say "success" for a matrix one of whose legs was cancelled before a
        # runner took it (https://github.com/orgs/community/discussions/211624), so every finished job
        # of this run, each matrix leg on its own, is checked as well, except the ones in UNGATED:
        # whether they are finished at this point is a matter of timing.
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          gh api "$JOBS" > jobs.json
          jq --argjson ungated "$UNGATED" '[.jobs[] | select(.status == "completed")
            | select(.name as $n | $ungated | any(. as $p | $n | startswith($p)) | not)]' jobs.json > gated.json
          jq -r '.[] | "\(.name): \(.conclusion)"' gated.json
          jq -e 'all(.[]; .conclusion == "success" or .conclusion == "skipped")' gated.json > /dev/null
