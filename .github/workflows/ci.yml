name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.2' && 'xdebug' || 'none' }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        if: matrix.php-version != '8.2'
        run: vendor/bin/phpunit

      - name: Run tests with coverage
        if: matrix.php-version == '8.2'
        run: vendor/bin/phpunit --coverage-text

  lowest:
    name: PHP 8.2, lowest dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # composer.lock is not committed, so the `test` job always resolves the
      # newest allowed dependency. brick/math spans nine 0.x minors here, and
      # its floor (0.12, where RoundingMode's cases are still SCREAMING_SNAKE)
      # is the half the `test` job never touches.
      - name: Install lowest dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
